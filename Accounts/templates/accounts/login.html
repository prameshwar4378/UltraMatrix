<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f6f9ff, #eef6ff 60%, #fff);
            font-family: "Segoe UI", sans-serif;
        }

        .login-card {
            width: min(420px, calc(100vw - 32px));
            background: #fff;
            border: 1px solid #e5edf8;
            border-radius: 8px;
            box-shadow: 0 24px 70px rgba(18, 60, 122, .13);
            padding: 28px;
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 800;
        }

        .form-control {
            min-height: 44px;
            border-radius: 8px;
        }

        .btn-primary {
            min-height: 46px;
            border: 0;
            border-radius: 8px;
            background: #123c7a;
            font-weight: 800;
        }

    </style>
</head>
<body>
    <div class="login-card">
        <h1>Log in</h1>
        <p class="text-muted mb-4">Use your school account credentials.</p>

        {% if form.errors %}
            <div class="alert alert-danger">Invalid username or password.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                <input class="form-control" type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" autofocus required>
            </div>

            <div class="mb-4">
                <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                <input class="form-control" type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>

        <p class="text-center text-muted mt-4 mb-0">
            New school?
            <a href="{% url 'school_signup' %}">Start free trial</a>
        </p>
    </div>
</body>
</html>
